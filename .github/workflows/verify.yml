name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production release
        shell: bash
        run: npm run verify 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      # Failures as annotations, readable on the run's page and through the API.
      - name: Report failures
        if: failure()
        shell: bash
        run: grep -E "^not ok|# fail|Smoke test failed|^- |Error|failed" verify.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
